name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml

jobs:
  busted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW uses Lua 5.1, so test on the same version.
      - name: Install Lua 5.1 and LuaRocks
        run: sudo apt-get update && sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks

      - name: Install busted
        run: sudo luarocks --lua-version=5.1 install busted

      - name: Syntax check add-on files
        run: luac5.1 -p WoWForeverWindfuryTimer/*.lua

      - name: Run tests
        run: busted spec
