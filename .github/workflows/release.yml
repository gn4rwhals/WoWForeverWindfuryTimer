name: Release

# Push a tag like v0.2.0 to publish a release. The tag must match the
# "## Version:" line in the .toc file (without the "v").
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the TOC version
        run: |
          toc=$(sed -n 's/^## Version: *\([^[:space:]]*\).*/\1/p' WoWForeverWindfuryTimer/WoWForeverWindfuryTimer.toc)
          if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $toc"
            exit 1
          fi

      # Only the add-on folder, at the top of the zip, so players can unpack
      # it straight into Interface\AddOns.
      - name: Build zip
        run: git archive --format=zip -o "WoWForeverWindfuryTimer-$GITHUB_REF_NAME.zip" HEAD WoWForeverWindfuryTimer

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "WoWForeverWindfuryTimer-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
